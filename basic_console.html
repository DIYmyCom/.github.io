<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASIC コンソール</title>

<style>
    body {
        font-family: sans-serif;
        margin: 20px;
        background-color: #f0f0f0;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 5px;
        cursor: pointer;
    }

    #terminal {
        background-color: #000;
        color: #0f0;
        font-family: monospace;
        padding: 10px;
        height: 24em;
        overflow-y: scroll;
        border: 2px solid #333;
        margin-top: 15px;
        white-space: pre-wrap;
    }

    .status {
        font-weight: bold;
        color: #333;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
</head>

<body>

<h1>BASIC コンソール</h1>

<div>
    <button id="btn-connect">マイコンに接続</button>
    <span id="status" class="status">未接続</span>
</div>

<hr>

<div>
    <h3>プログラムを選択してダウンロード</h3>

    <button id="btn-hello" disabled>HelloWorld</button>
    <button id="btn-invader" disabled>インベーダ</button>
    <button id="btn-pacman" disabled>パックマン</button>
    <button id="btn-shoot" disabled>SHOOT</button>
</div>

<hr>
<div>
    <h3>コマンドを実行</h3>
    <button id="btn-run" disabled>RUN</button>
    <button id="btn-list" disabled>LIST</button>
    <button id="btn-new" disabled>NEW</button>
</div>


<hr>

<h3>マイコンへテキスト送信</h3>

<div>
    <input
        type="text"
        id="text-input"
        placeholder="送信したい文字列を入力"
        style="width:70%; font-size:16px; padding:8px;"
    >

    <button id="btn-send-text" disabled>
        テキスト送信
    </button>
</div>

<hr>

<h3>マイコンからのエコーバック</h3>
<div id="terminal"></div>

<script>

let port;
let writer;
let reader;
let keepReading = true;

const btnConnect = document.getElementById('btn-connect');

const btnHello = document.getElementById('btn-hello');
const btnInvader = document.getElementById('btn-invader');
const btnPacman = document.getElementById('btn-pacman');
const btnShoot = document.getElementById('btn-shoot');

const btnRun = document.getElementById('btn-run');
const btnList = document.getElementById('btn-list');
const btnNew = document.getElementById('btn-new');

const btnSendText = document.getElementById('btn-send-text');
const textInput = document.getElementById('text-input');

const statusEl = document.getElementById('status');
const terminal = document.getElementById('terminal');

const programs = {
    hello: 'basic_console/HelloWorld.bas',
    invader: 'basic_console/Invaders10.bas',
    pacman: 'basic_console/Pakman16.bas',
    shoot: 'basic_console/shoot16.bas'
};

function logToTerminal(text) {
    terminal.textContent += text;
    terminal.scrollTop = terminal.scrollHeight;
}

const sleep = ms => new Promise(res => setTimeout(res, ms));

// ★文字列をマイコンが期待する「EUC-JP」のバイナリ(Uint8Array)に変換する関数
function convertToEUCJP(text) {

    // Unicode文字列 → UTF16配列
    const unicodeArray = Encoding.stringToCode(text);

    // UTF16 → EUC-JP
    const eucArray = Encoding.convert(unicodeArray, {
        to: 'EUCJP',
        from: 'UNICODE'
    });

    return new Uint8Array(eucArray);
}


// ========================================
// シリアル接続
// ========================================

btnConnect.addEventListener('click', async () => {

    if (!('serial' in navigator)) {
        alert('Web Serial API未対応ブラウザです');
        return;
    }

    try {

        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 57600,
            dataBits: 8,
            stopBits: 1,
            parity: 'none',
            flowControl: 'none'
        });

        statusEl.textContent = '接続済み';
        statusEl.style.color = 'green';

        btnHello.disabled = false;
        btnInvader.disabled = false;
        btnPacman.disabled = false;
        btnRun.disabled = false;
        btnList.disabled = false;
        btnNew.disabled = false;
        btnShoot.disabled = false;

        readLoop();

    } catch (error) {

        console.error(error);

        statusEl.textContent = '接続失敗: ' + error.message;
        statusEl.style.color = 'red';
    }
});


// ========================================
// 受信処理 (★マイコンに合わせて EUC-JP でデコード)
// ========================================

async function readLoop() {

    while (port && port.readable && keepReading) {

        try {

            reader = port.readable.getReader();

            while (true) {

                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                if (value && value.length > 0) {

                    const bytes = Array.from(value);

                    const unicodeArray = Encoding.convert(bytes, {
                        to: 'UNICODE',
                        from: 'EUCJP'
                    });

                    const text = Encoding.codeToString(unicodeArray);

                    // CR → CRLF に変換
                    logToTerminal(text.replace(/\r/g, '\r\n'));
                }
            }

        } catch (error) {

            console.error(error);
            break;

        } finally {

            if (reader) {
                reader.releaseLock();
            }
        }
    }
}


// ========================================
// BASIC転送
// ========================================

async function downloadAndSend(url) {

    setButtonsDisabled(true);

    logToTerminal(`\n--- ダウンロード開始: ${url} ---\n`);

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error('ファイル取得失敗');
        }

        const buffer = await response.arrayBuffer();

        // ★1. ファイルはSJISなので、まずは shift_jis で正しくデコード
        // Shift_JIS のバイト列
        const sjisArray = new Uint8Array(buffer);

        // Shift_JIS → Unicode
        const unicodeArray = Encoding.convert(sjisArray, {
            to: 'UNICODE',
            from: 'SJIS'
        });

        const text = Encoding.codeToString(unicodeArray);

        const lines = text.split(/\r?\n/);

        writer = port.writable.getWriter();

        for (let i = 0; i < lines.length; i++) {

            const line = lines[i];

            if (i === lines.length - 1 && line.trim() === '') {
                continue;
            }

            const sendText = line + '\r';

            // ★2. マイコンが期待する EUC-JP のバイナリに変換して送信
            const encoded = await convertToEUCJP(sendText);

            await writer.write(encoded);

            await sleep(100);
        }

        logToTerminal('\n--- 送信完了 ---\n');

    } catch (error) {

        alert('エラー: ' + error.message);
        logToTerminal(`\nエラー: ${error.message}\n`);

    } finally {

        if (writer) {
            writer.releaseLock();
        }

        setButtonsDisabled(false);
    }
}


// ========================================
// コマンド送信
// ========================================

async function sendCommand(command) {

    try {

        writer = port.writable.getWriter();

        const sendText = command + '\r';

        const encoded = convertToEUCJP(sendText);

        await writer.write(encoded);

        logToTerminal('\n> ' + command + '\n');

    } catch (error) {

        alert(command + '送信失敗: ' + error.message);

    } finally {

        if (writer) {
            writer.releaseLock();
        }
    }
}

// ========================================
// コマンド送信
// ========================================

async function sendRunCommand() {

    await sendCommand('run');
}

async function sendListCommand() {

    await sendCommand('list');
}

async function sendNewCommand() {

    await sendCommand('new');
}
// ========================================
// ボタン有効/無効
// ========================================

function setButtonsDisabled(disabled) {

    btnHello.disabled = disabled;
    btnInvader.disabled = disabled;
    btnPacman.disabled = disabled;
    btnRun.disabled = disabled;
    btnList.disabled = disabled;
    btnNew.disabled = disabled;
    btnShoot.disabled = disabled;
    btnSendText.disabled = disabled;
}

// ========================================
// テキスト送信
// ========================================

async function sendTextToMicrocontroller() {

    const text = textInput.value;

    if (!text) {
        return;
    }

    try {

        writer = port.writable.getWriter();

        // 改行付き送信
        const sendText = text + '\r';

        // EUC-JPへ変換
        const encoded = convertToEUCJP(sendText);

        await writer.write(encoded);

        // ローカル表示
        logToTerminal('\n> ' + text + '\n');

        // 入力欄クリア
        textInput.value = '';

    } catch (error) {

        alert('送信失敗: ' + error.message);

    } finally {

        if (writer) {
            writer.releaseLock();
        }
    }
}

// ========================================
// イベント
// ========================================

btnHello.addEventListener(
    'click',
    () => downloadAndSend(programs.hello)
);

btnInvader.addEventListener(
    'click',
    () => downloadAndSend(programs.invader)
);

btnPacman.addEventListener(
    'click',
    () => downloadAndSend(programs.pacman)
);

btnRun.addEventListener(
    'click',
    sendRunCommand
);
btnList.addEventListener(
    'click',
    sendListCommand
);

btnNew.addEventListener(
    'click',
    sendNewCommand
);

btnShoot.addEventListener(
    'click',
    () => downloadAndSend(programs.shoot)
);

btnSendText.addEventListener(
    'click',
    sendTextToMicrocontroller
);

textInput.addEventListener('keydown', (e) => {

    if (e.key === 'Enter') {
        sendTextToMicrocontroller();
    }
});
</script>

</body>
</html>
