<style>

    background:#333;

<body>
<include id='menu.html'></include>

<p class="chapter8">エディタ（EUC-JP・CRLF）</p>

<div class="toolbar">

    <input type="file" id="fileInput">

    <button onclick="saveFile()">
        保存（EUC-JP / CRLF）
    </button>

    <span>
        Ctrl + F で検索可能
    </span>

    <div class="info" id="info"></div>
</div>

<textarea id="editor" spellcheck="false"></textarea>

<script>
const editor = document.getElementById("editor");
const info = document.getElementById("info");


// ========================================
// ファイル読み込み
// ========================================
document.getElementById("fileInput").addEventListener("change", async (e)=>{

    const file = e.target.files[0];
    if(!file) return;

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);

    let text = "";
    let encoding = "UTF-8";

    // BOM付きUTF-8
    if(bytes[0] === 0xEF &&
       bytes[1] === 0xBB &&
       bytes[2] === 0xBF){

        encoding = "UTF-8";
    }
    else{

        // UTF-8
        try{
            text = new TextDecoder("utf-8", {
                fatal:true
            }).decode(bytes);

            encoding = "UTF-8";
        }
        catch{

            // EUC-JP
            try{
                text = new TextDecoder("euc-jp", {
                    fatal:true
                }).decode(bytes);

                encoding = "EUC-JP";
            }
            catch{

                // Shift_JIS
                try{
                    text = new TextDecoder("shift_jis", {
                        fatal:true
                    }).decode(bytes);

                    encoding = "Shift_JIS";
                }
                catch{

                    // 最終手段
                    text = new TextDecoder("utf-8")
                        .decode(bytes);

                    encoding = "不明";
                }
            }
        }
    }

    if(text === ""){
        text = new TextDecoder("utf-8")
            .decode(bytes);
    }

    // 改行コード判定
    let newline = "LF";

    if(text.includes("\r\n")){
        newline = "CRLF";
    }
    else if(text.includes("\r")){
        newline = "CR";
    }

    editor.value = text;

    info.textContent =
        `文字コード: ${encoding} / 改行: ${newline}`;
});


// ========================================
// 保存
// EUC-JP + CR
// 保存先フォルダ選択対応
// ========================================
async function saveFile(){

    let text = editor.value;

    // 改行コードをCRLFへ統一
    text = text.replace(/\r\n/g, "\r");
    text = text.replace(/\r/g, "\n");
    text = text.replace(/\n/g, "\r\n");

    // UTF-16(JavaScript文字列) → EUC-JP
    const encoded = Encoding.convert(
        Encoding.stringToCode(text),
        {
            to: "EUCJP",
            from: "UNICODE"
        }
    );

    // Uint8Array化
    const uint8 = new Uint8Array(encoded);  

    const blob = new Blob(
        [uint8],
        {type:"application/octet-stream"}
    );

    // ====================================
    // File System Access API
    // PC Chrome / Android Chrome対応
    // 保存先フォルダを選択可能
    // ====================================
    if(window.showSaveFilePicker){

        try{

            const handle =
                await window.showSaveFilePicker({

                suggestedName: "text.txt",

                types: [{
                    description: "Text File",
                    accept: {
                        "text/plain": [".txt", ".bas"]
                    }
                }]
            });

            const writable =
                await handle.createWritable();

            await writable.write(blob);
            await writable.close();

            alert("保存しました");

        }
        catch(err){

            console.log(err);
        }
    }
    else{

        // 古いブラウザ用フォールバック
        const a = document.createElement("a");

        a.href = URL.createObjectURL(blob);
        a.download = "text.txt";

        a.click();

        URL.revokeObjectURL(a.href);
    }
}


// ========================================
// Ctrl + F
// ========================================
window.addEventListener("keydown", (e)=>{

    if(e.ctrlKey &&
       e.key.toLowerCase() === "f"){

        editor.focus();
    }
});
</script>
