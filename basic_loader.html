<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC Program Downloader</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        #terminal {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 24em; /* 約20行分の高さ */
            overflow-y: scroll;
            border: 2px solid #333;
            margin-top: 15px;
            white-space: pre-wrap;
        }
        .status {
            font-weight: bold;
            color: #333;
        }
    </style>
    <!-- EUC-JPのデコード/エンコードのためにTextEncoderLite/TextDecoderLite等を代用、
         または標準のTextDecoder(euc-jp)を利用するためのスクリプト -->
</head>
<body>

    <h1>BASIC Program Downloader</h1>
    
    <div>
        <button id="btn-connect">1. USBマイコンに接続</button>
        <span id="status" class="status">未接続</span>
    </div>

    <hr>

    <div>
        <h3>2. プログラムを選択してダウンロード</h3>
        <button id="btn-hello" disabled>HelloWorld</button>
        <button id="btn-invader" disabled>インベーダ</button>
        <button id="btn-pacman" disabled>パックマン</button>
    </div>

    <hr>

    <h3>マイコンからのエコーバック</h3>
    <div id="terminal"></div>

    <script>
        let port;
        let writer;
        let reader;
        let keepReading = true;

        const btnConnect = document.getElementById('btn-connect');
        const btnHello = document.getElementById('btn-hello');
        const btnInvader = document.getElementById('btn-invader');
        const btnPacman = document.getElementById('btn-pacman');
        const statusEl = document.getElementById('status');
        const terminal = document.getElementById('terminal');

        // 各ボタンの転送URL設定
        const programs = {
            hello: 'index/img/hello.bas',
            invader: 'https://diymycom.pythonanywhere.com/uploads_bas/0014.bas',
            pacman: 'https://diymycom.pythonanywhere.com/uploads_bas/0016.bas'
        };

        // ターミナルへの出力関数
        function logToTerminal(text) {
            terminal.textContent += text;
            terminal.scrollTop = terminal.scrollHeight; // 最下部へスクロール
        }

        // 100msウェイト用
        const sleep = ms => new Promise(res => setTimeout(res, ms));

        // シリアル接続処理
        btnConnect.addEventListener('click', async () => {
            if (!('serial' in navigator)) {
                alert('お使いのブラウザはWeb Serial APIをサポートしていません。Android Chromeでflagsの設定を確認してください。');
                return;
            }

            try {
                // ユーザーにポートを選択させる
                port = await navigator.serial.requestPort();
                
                // 仕様通りの通信設定でオープン
                await port.open({
                    baudRate: 57600,
                    dataBits: 8,
                    stopBits: 1,
                    parity: 'none',
                    flowControl: 'none'
                });

                statusEl.textContent = '接続済み';
                statusEl.style.color = 'green';
                
                // ボタンの有効化
                btnHello.disabled = false;
                btnInvader.disabled = false;
                btnPacman.disabled = false;

                // 受信ルーチンの開始
                readLoop();

            } catch (error) {
                console.error(error);
                statusEl.textContent = '接続失敗: ' + error.message;
                statusEl.style.color = 'red';
            }
        });

        // 受信処理（マイコンからのエコーを監視）
        async function readLoop() {
            // EUC-JPでデコードする設定
            const decoder = new TextDecoder('euc-jp');
            
            while (port && port.readable && keepReading) {
                try {
                    reader = port.readable.getReader();
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) {
                            break;
                        }
                        if (value) {
                            // 受信データをEUC-JPでテキスト化してターミナルに表示
                            // 受信改行コードは仕様がCR+LF、JS側はそのまま表示すれば改行されます
                            const text = decoder.decode(value);
                            logToTerminal(text);
                        }
                    }
                } catch (error) {
                    console.error(error);
                    break;
                } finally {
                    if (reader) {
                        reader.releaseLock();
                    }
                }
            }
        }

        // プログラムをダウンロードしてシリアル送信するメイン処理
        async function downloadAndSend(url) {
            // 送信中はボタンを無効化
            setButtonsDisabled(true);
            logToTerminal(`\n--- ダウンロード開始: ${url} ---\n`);

            try {
                // WEBからファイルを取得
                const response = await fetch(url);
                if (!response.ok) throw new Error('ファイルの取得に失敗しました。');
                
                // 一旦テキストとして読み込み（CORSエラーに注意）
                const text = await response.text();
                
                // 行ごとに分割
                const lines = text.split(/\r?\n/);
                
                // EUC-JP用のエンコーダーを用意
                const encoder = new TextEncoder('euc-jp', { NONSTANDARD_allowLegacyEncoding: true });
                writer = port.writable.getWriter();

                for (let line of lines) {
                    // 空行のスキップ処理（必要に応じて）
                    if (line.trim() === '' && lines.indexOf(line) === lines.length - 1) continue;

                    // 仕様：送信改行コードはCRのみ
                    const sendText = line + '\r'; 
                    
                    // EUC-JPに変換して送信
                    // ※標準のTextEncoderはUTF-8固定なため、環境によってはエラーになる場合があります。
                    // その場合はポリフィル(Polyfill)等のライブラリが必要です。
                    let encoded;
                    try {
                        encoded = new TextEncoder('euc-jp').encode(sendText);
                    } catch(e) {
                        // ブラウザがTextEncoder('euc-jp')をサポートしていない場合のフォールバック
                        // レガシーブラウザ対策。現在の主要ブラウザはTextDecoderはeuc-jp対応ですがEncoderは不完全な場合があります。
                        encoded = new TextEncoder().encode(sendText); // 暫定UTF-8
                    }

                    await writer.write(encoded);
                    
                    // 仕様：1行送信ごとに100msウェイト
                    await sleep(100);
                }

                logToTerminal('\n--- 送信完了 ---\n');

            } catch (error) {
                alert('エラーが発生しました: ' + error.message);
                logToTerminal(`\nエラー: ${error.message}\n`);
            } finally {
                if (writer) {
                    writer.releaseLock();
                }
                setButtonsDisabled(false);
            }
        }

        function setButtonsDisabled(disabled) {
            btnHello.disabled = disabled;
            btnInvader.disabled = disabled;
            btnPacman.disabled = disabled;
        }

        // 各ボタンのイベントリスナー
        btnHello.addEventListener('click', () => downloadAndSend(programs.hello));
        btnInvader.addEventListener('click', () => downloadAndSend(programs.invader));
        btnPacman.addEventListener('click', () => downloadAndSend(programs.pacman));

    </script>
</body>
</html>
